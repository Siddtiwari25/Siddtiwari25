<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Professional developer profile banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#07111F"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7C3AED"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".055"/></pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .muted{fill:#94A3B8}.white{fill:#F8FAFC}.cyan{fill:#22D3EE}.violet{fill:#A78BFA}.green{fill:#34D399}
  </style>
</defs>
<rect x="5" y="5" width="1170" height="600" rx="24" fill="url(#bg)" stroke="#334155"/>
<rect x="5" y="5" width="1170" height="600" rx="24" fill="url(#grid)"/>
<circle cx="310" cy="260" r="290" fill="url(#glow)" filter="url(#shadow)"/>
<rect x="22" y="22" width="1136" height="42" rx="12" fill="#0F172A" fill-opacity=".82" stroke="#334155"/>
<circle cx="46" cy="43" r="6" fill="#EF4444"/><circle cx="66" cy="43" r="6" fill="#F59E0B"/><circle cx="86" cy="43" r="6" fill="#10B981"/>
